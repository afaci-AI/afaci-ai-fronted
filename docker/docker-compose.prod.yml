# Запуск из корня репозитория: docker compose -f docker/docker-compose.prod.yml --project-directory . up --build -d
name: afaci

services:
  frontend:
    build:
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - '${FRONTEND_PORT:-86}:3000'
    networks:
      - afaci-network

volumes:
  afaci-pgdata:

networks:
  afaci-network:
    driver: bridge
