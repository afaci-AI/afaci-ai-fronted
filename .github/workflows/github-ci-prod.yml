name: ci-prod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  frontend-analysis:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
  
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
  
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx tsc --noEmit

  build:
    name: build
    runs-on: afaci-runner-01
    needs:
      - frontend-analysis
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
  
      - name: Extract Tag Name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
  
      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            -f Dockerfile.prod \
            -t afaci-ai-frontend:${{ env.TAG_NAME }} \
            -t afaci-ai-frontend:prod \
            .


  deploy:
    name: deploy
    runs-on: afaci-runner-01
    needs: build
  
    steps:
      - name: Execute remote SSH commands
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ vars.APP_PATH }}
          TAG_NAME: ${{ github.ref_name }}
  
        run: |
          set -euo pipefail
  
          : "${SSH_HOST:?SSH_HOST is required}"
          : "${SSH_USER:?SSH_USER is required}"
          : "${SSH_KEY:?SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS is required}"
          : "${APP_PATH:?APP_PATH is required}"
          : "${TAG_NAME:?TAG_NAME is required}"
  
          SSH_PORT="${SSH_PORT:-22}"
  
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
  
          KEY_FILE=$(mktemp)
          KNOWN_HOSTS_FILE=$(mktemp)
  
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT
  
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
  
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"
  
          REMOTE_COMMAND="bash -se -- $(printf '%q' "$APP_PATH") $(printf '%q' "$TAG_NAME")"
  
          ssh \
            -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$SSH_USER@$SSH_HOST" \
            "$REMOTE_COMMAND" <<'REMOTE'
          set -euo pipefail
  
          APP_PATH="$1"
          TAG_NAME="$2"
  
          cd "$APP_PATH"
  
          echo "Fetching Git tags..."
          git fetch --tags
  
          echo "Checking deployment tag..."
          git rev-parse --verify "refs/tags/$TAG_NAME^{commit}"
  
          echo "Checking out tag..."
          git checkout --detach "refs/tags/$TAG_NAME"
  
          echo "Deploying containers..."
          docker compose -f docker-compose.prod.yml up --build -d
  
          echo "Deployment completed."
          REMOTE


  create-release:
    name: Create GitHub Release
    runs-on: afaci-runner-01
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
