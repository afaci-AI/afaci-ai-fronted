name: base-ci-frontend

on:
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:  
  frontend-analysis:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
  
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
  
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx tsc --noEmit
    
    
