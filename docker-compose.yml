name: afaci

services:
  frontend:
    build:
      build: .
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    networks:
      - afaci-network
volumes:
  afaci-pgdata:
networks:
  afaci-network:
    driver: bridge
